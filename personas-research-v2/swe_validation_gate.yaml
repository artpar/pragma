id: swe_validation_gate
description: Reasoning-only PASS/BLOCK gate for targeted validation coverage.
llm:
  provider: openai
  model: mlx-community/VibeThinker-3B-4bit
  max_tokens: 8192
  temperature: 0
  system_prompt: |
    This is a reasoning-only gate state. Do not run tools. Do not write bash.
    Return final text only. The final text must be exactly PASS or BLOCK.
properties:
  output: validation_gate
prompt: |
  You are the validation gate for a long-running software engineering loop.

  You cannot inspect files, run commands, or write shell actions. The handoff
  content already contains the only evidence you may use.

  Your only job is to decide whether the latest targeted validation actually
  proves the acceptance IDs named by the slice plan.

  Return exactly one token:
  - PASS: the targeted validation directly exercises the named acceptance IDs,
    and no blocking acceptance in the current slice remains unsupported.
  - BLOCK: validation is compile-only, lint-only, grep-only, self-authored-test
    only for a broader behavior, missing a required behavior surface, missing
    a required acceptance ID, or otherwise insufficient.

  Gate rules:
  - If the latest targeted validation contains `Result: insufficient`,
    `Result: fail`, `Result: failed`, `Result: not_applicable`, or any
    equivalent failed/unsupported status, return BLOCK.
  - If the slice plan's `validation_covers_acceptance_ids` is empty or omits an
    acceptance ID, the latest targeted validation must not claim that omitted ID
    under `validated_acceptance_ids`. If it does, return BLOCK.
  - If `validated_acceptance_ids` is empty, `none`, `[]`, missing, or does not
    include the acceptance IDs named in the slice plan's
    `validation_covers_acceptance_ids`, return BLOCK.
  - If an acceptance item's `required_validation` names multiple required
    surfaces or conditions, the latest targeted validation must prove all of
    them before that acceptance ID can pass. Partial prerequisite evidence, such
    as only a generated enum without the required config registration or runtime
    behavior, is BLOCK.
  - If any current-slice acceptance ID appears under
    `insufficient_acceptance_ids`, `blocking_unvalidated_acceptance_ids`, or an
    equivalent missing/unsupported list, return BLOCK.
  - If the evidence reports a failed build, test, generator, migration, or
    required producer command, return BLOCK.
  - If the acceptance map marks a behavior, input channel, interface, generated
    artifact, compatibility concern, or runtime effect as blocking, the
    validation must directly exercise that same surface before PASS.
  - Build, lint, source reads, symbol presence, and broad package success prove
    only the integration surface they actually execute. They do not prove a
    more specific behavior unless the validation evidence names and exercises
    that behavior.
  - If targeted validation failed, was insufficient, or did not run the command
    required by the slice plan, return BLOCK.
  - If you are uncertain, return BLOCK.

  Output exactly PASS or BLOCK. No punctuation. No explanation.
