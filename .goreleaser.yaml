version: 2

before:
  hooks:
    - go test ./...
    - go test ./internal/archtest/ -v
    - mkdir -p completions
    - go run ./cmd/pragma/ completion bash > completions/pragma.bash
    - go run ./cmd/pragma/ completion zsh > completions/pragma.zsh
    - go run ./cmd/pragma/ completion fish > completions/pragma.fish

builds:
  - id: pragma
    main: ./cmd/pragma/
    binary: pragma
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/artpar/pragma/internal/buildinfo.Version={{.Version}}
      - -X github.com/artpar/pragma/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/artpar/pragma/internal/buildinfo.Date={{.Date}}
      - -X github.com/artpar/pragma/internal/buildinfo.GoVersion={{.Env.GOVERSION}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - completions/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: artpar
    name: pragma-releases
  draft: false
  prerelease: auto

nfpms:
  - id: packages
    package_name: pragma
    homepage: https://github.com/artpar/pragma-releases
    maintainer: artpar
    description: AI coding assistant CLI powered by LLMs
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: ./completions/pragma.bash
        dst: /usr/share/bash-completion/completions/pragma
      - src: ./completions/pragma.zsh
        dst: /usr/share/zsh/vendor-completions/_pragma
      - src: ./completions/pragma.fish
        dst: /usr/share/fish/vendor_completions.d/pragma.fish

brews:
  - name: pragma
    repository:
      owner: artpar
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/artpar/pragma-releases
    description: AI coding assistant CLI powered by LLMs
    install: |
      bin.install "pragma"
      bash_completion.install "completions/pragma.bash" => "pragma"
      zsh_completion.install "completions/pragma.zsh" => "_pragma"
      fish_completion.install "completions/pragma.fish"
    test: |
      system "#{bin}/pragma", "version"

scoops:
  - name: pragma
    folder: bucket
    repository:
      owner: artpar
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: https://github.com/artpar/pragma-releases
    description: AI coding assistant CLI powered by LLMs
