name: playful-checklist-loop
initial: parade_master
states:
  - id: parade_master
    persona: parade_master
    artifacts:
      inputs:
        - id: checklist
          path: /tmp/pragma/play/checklist.json
          description: Existing parade checklist, when this is a later visit.
        - id: current_item
          path: /tmp/pragma/play/current-item.json
          description: Current parade item, when returning from the item loop.
        - id: float_card
          path: /tmp/pragma/play/float-card.md
          description: Float artist card from the previous item, when present.
        - id: ribbon_note
          path: /tmp/pragma/handoff-prompts/ribbon_judge/item_approve.md
          description: Ribbon judge note for parade master, when present.
      outputs:
        - id: checklist
          path: /tmp/pragma/play/checklist.json
          required: true
          description: Parade checklist.

  - id: parade_next
    control:
      foreach_next:
        list_path: /tmp/pragma/play/checklist.json
        cursor_path: /tmp/pragma/play/current-item.json
        handoff_path: /tmp/pragma/handoff-prompts/parade_next/current-item.md
        pending_status: pending
        done_status: completed
        item_event: item_available
        done_event: all_items_done

  - id: float_artist
    persona: float_artist
    task_prompt: none
    artifacts:
      inputs:
        - id: current_item
          path: /tmp/pragma/play/current-item.json
          required: true
          description: Current parade item selected by the item loop.
        - id: current_item_handoff
          path: /tmp/pragma/handoff-prompts/parade_next/current-item.md
          required: true
          description: Immediate handoff written by the parade_next control for the selected item.
      outputs:
        - id: float_card
          path: /tmp/pragma/play/float-card.md
          required: true
          description: Float artist card for the current item.

  - id: ribbon_judge
    persona: ribbon_judge
    task_prompt: none
    artifacts:
      inputs:
        - id: current_item
          path: /tmp/pragma/play/current-item.json
          required: true
          description: Current parade item under review.
        - id: float_card
          path: /tmp/pragma/play/float-card.md
          required: true
          description: Float artist card for the current item.
      outputs:
        - id: item_verdict
          path: /tmp/pragma/play/item-verdict.md
          required: true
          kind: verdict
          allowed_values: [APPROVE, BLOCK]
          description: Ribbon judge verdict for the current parade item.
        - id: ribbon_note
          path: /tmp/pragma/handoff-prompts/ribbon_judge/item_approve.md
          description: Ribbon note for parade master after approval.
  - id: route_ribbon_verdict
    control:
      artifact_verdict:
        path: /tmp/pragma/play/item-verdict.md
        approve_event: item_approve
        block_event: item_block

  - id: stamp_float_done
    control:
      mark_current_item:
        list_path: /tmp/pragma/play/checklist.json
        cursor_path: /tmp/pragma/play/current-item.json
        status: completed
        event: complete

  - id: finale_announcer
    persona: finale_announcer
    task_prompt: none
    artifacts:
      inputs:
        - id: checklist
          path: /tmp/pragma/play/checklist.json
          required: true
          description: Completed parade checklist.
      outputs:
        - id: parade_finale
          path: /tmp/pragma/play/finale.md
          required: true
          description: Final parade announcement.

  - id: done
    terminal: true

transitions:
  - event: complete
    from: [parade_master]
    to: parade_next
  - event: item_available
    from: [parade_next]
    to: float_artist
  - event: all_items_done
    from: [parade_next]
    to: finale_announcer
  - event: complete
    from: [float_artist]
    to: ribbon_judge
  - event: complete
    from: [ribbon_judge]
    to: route_ribbon_verdict
  - event: item_approve
    from: [route_ribbon_verdict]
    to: stamp_float_done
  - event: item_block
    from: [route_ribbon_verdict]
    to: parade_master
  - event: complete
    from: [stamp_float_done]
    to: parade_master
  - event: complete
    from: [finale_announcer]
    to: done
