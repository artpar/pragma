name: patch-checklist-item-loop-final
initial: contract_analyst
states:
  - id: contract_analyst
    persona: contract_analyst

  - id: patch_planner
    persona: patch_planner

  - id: checklist_planner
    persona: checklist_planner

  - id: next_item
    control:
      foreach_next:
        list_path: /tmp/pragma/checklist.json
        cursor_path: /tmp/pragma/current-item.json
        pending_status: pending
        done_status: approved
        item_event: item_available
        done_event: all_items_done

  - id: item_implementer
    persona: item_implementer
    task_prompt: none

  - id: item_prosecutor
    persona: item_prosecutor
    task_prompt: none
  - id: route_item_prosecutor_verdict
    control:
      artifact_verdict:
        path: /tmp/pragma/item-prosecutor-verdict.md
        approve_event: item_approve
        block_event: item_block

  - id: mark_item_approved
    control:
      mark_current_item:
        list_path: /tmp/pragma/checklist.json
        cursor_path: /tmp/pragma/current-item.json
        status: approved
        event: complete

  - id: item_repair
    persona: item_repair
    task_prompt: none

  - id: final_prosecutor
    persona: final_prosecutor
  - id: route_final_prosecutor_verdict
    control:
      artifact_verdict:
        path: /tmp/pragma/final-prosecutor-verdict.md
        approve_event: final_approve
        block_event: final_block

  - id: done
    terminal: true

transitions:
  - event: complete
    from: [contract_analyst]
    to: patch_planner
  - event: complete
    from: [patch_planner]
    to: checklist_planner
  - event: complete
    from: [checklist_planner]
    to: next_item
  - event: item_available
    from: [next_item]
    to: item_implementer
  - event: all_items_done
    from: [next_item]
    to: final_prosecutor
  - event: complete
    from: [item_implementer]
    to: item_prosecutor
  - event: complete
    from: [item_prosecutor]
    to: route_item_prosecutor_verdict
  - event: item_approve
    from: [route_item_prosecutor_verdict]
    to: mark_item_approved
  - event: complete
    from: [mark_item_approved]
    to: next_item
  - event: item_block
    from: [route_item_prosecutor_verdict]
    to: item_repair
  - event: complete
    from: [item_repair]
    to: item_prosecutor
  - event: complete
    from: [final_prosecutor]
    to: route_final_prosecutor_verdict
  - event: final_approve
    from: [route_final_prosecutor_verdict]
    to: done
  - event: final_block
    from: [route_final_prosecutor_verdict]
    to: checklist_planner
