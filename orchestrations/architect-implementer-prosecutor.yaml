name: architect-implementer-prosecutor
initial: architect
states:
  - id: architect
    persona: architect
  - id: implementer
    persona: implementer
  - id: prosecutor
    persona: prosecutor
  - id: route_prosecutor_verdict
    control:
      artifact_verdict:
        path: /tmp/pragma/prosecutor-verdict.md
        approve_event: approve
        block_event: block
  - id: repair
    persona: repair
  - id: done
    terminal: true
transitions:
  - event: complete
    from: [architect]
    to: implementer
  - event: complete
    from: [implementer]
    to: prosecutor
  - event: complete
    from: [prosecutor]
    to: route_prosecutor_verdict
  - event: approve
    from: [route_prosecutor_verdict]
    to: done
  - event: block
    from: [route_prosecutor_verdict]
    to: repair
  - event: complete
    from: [repair]
    to: prosecutor
