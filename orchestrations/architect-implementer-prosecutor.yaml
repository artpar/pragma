name: architect-implementer-prosecutor
initial: architect
states:
  - id: architect
    persona: architect
  - id: implementer
    persona: implementer
  - id: prosecutor
    persona: prosecutor
    event:
      from_file:
        path: /tmp/pragma/prosecutor-verdict.md
        rules:
          - contains: "Decision:\nAPPROVE"
            event: approve
          - contains: "Decision:\nBLOCK"
            event: block
  - id: repair
    persona: repair
  - id: done
    terminal: true
transitions:
  - event: complete
    from: [architect]
    to: implementer
  - event: complete
    from: [implementer]
    to: prosecutor
  - event: approve
    from: [prosecutor]
    to: done
  - event: block
    from: [prosecutor]
    to: repair
  - event: complete
    from: [repair]
    to: prosecutor
