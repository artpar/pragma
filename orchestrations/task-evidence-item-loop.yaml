name: task-evidence-item-loop
initial: surface_mapper
states:
  - id: surface_mapper
    persona: surface_mapper
    artifacts:
      outputs:
        - id: surface_map
          path: /tmp/pragma/surface-map.md
          required: true
          description: Initial map of task-named and likely repository surfaces.

  - id: evidence_collector
    persona: evidence_collector
    task_prompt: none
    artifacts:
      outputs:
        - id: repo_evidence
          path: /tmp/pragma/repo-evidence.md
          required: true
          description: Direct source, test, fixture, code-flow, and validation facts collected from the mapped surfaces.

  - id: behavior_evidence_mapper
    persona: evidence_mapper
    task_prompt: none
    artifacts:
      outputs:
        - id: evidence_map
          path: /tmp/pragma/evidence-map.md
          required: true
          description: Source, consumer, fixture, producer, and validation evidence.

  - id: patch_planner
    persona: patch_planner
    task_prompt: none
    artifacts:
      outputs:
        - id: patch_plan
          path: /tmp/pragma/patch-plan.md
          required: true
          description: Bounded patch route derived from evidence and any active verdict.

  - id: checklist_writer
    persona: checklist_writer
    task_prompt: none
    artifacts:
      outputs:
        - id: checklist
          path: /tmp/pragma/checklist.json
          required: true
          description: JSON checklist consumed by the item loop.

  - id: next_item
    persona: next_item
    conversation: persistent
    artifacts:
      outputs:
        - id: current_item_handoff
          path: /tmp/pragma/handoff-prompts/next_item/current-item.md
          required: true
          description: Persona-authored handoff for the selected item worker.
    control:
      foreach_next:
        list_path: /tmp/pragma/checklist.json
        cursor_path: /tmp/pragma/current-item.json
        cursor_artifact_id: current_item
        cursor_artifact_description: Current checklist item selected by the item loop.
        handoff_path: /tmp/pragma/handoff-prompts/next_item/current-item.md
        handoff_mode: persona
        item_contract: |
          ```json
          {
            "items": [
              {
                "id": "stable-string-id",
                "title": "string",
                "description": "string",
                "approach": "string",
                "acceptance": ["string"],
                "allowed_files": ["string"],
                "forbidden_files": ["string"],
                "coupled_edit_paths": ["string"],
                "acceptance_check": "string",
                "validation_command": "string",
                "validation_deferred_until": "string",
                "report_changed_files": ["string"],
                "blocked_by": ["item-id"],
                "block_reason": "string",
                "status": "pending"
              }
            ]
          }
          ```

          `acceptance`, `allowed_files`, `forbidden_files`, `coupled_edit_paths`, `report_changed_files`, and `blocked_by` must be JSON arrays.
          Use `validation_command: "none"` only when `acceptance_check` is present or `validation_deferred_until` names what later item or surface makes validation runnable.
          Put every path from `coupled_edit_paths` in `allowed_files`; the worker may edit only `allowed_files`.
        dependency:
          dependency_ids_field: blocked_by
          dependency_reason_field: block_reason
          deferred_dependency_field: validation_deferred_until
          blocked_status: blocked
          unblocked_status: pending
          auto_block_deferred: true
          auto_unblock_dependents: true
          blocked_cursor_reason: No pending items remain; blocked items are waiting on declared prerequisites.
          missing_dependency_reason: Blocked by a declared prerequisite.
        pending_status: pending
        blocked_status: blocked
        done_status: completed
        item_event: item_available
        done_event: all_items_done
        blocked_event: items_blocked

  - id: item_worker
    persona: item_worker
    task_prompt: none
    artifacts:
      outputs:
        - id: implementer_report
          path: /tmp/pragma/implementer-report.md
          required: true
          description: Worker report with changed files, acceptance evidence, validation, risk, and blocker status.
        - id: item_validation_log
          path: /tmp/pragma/item-validation.log
          description: Focused item validation log when validation is run.

  - id: item_reviewer
    persona: item_reviewer
    task_prompt: none
    artifacts:
      outputs:
        - id: item_verdict
          path: /tmp/pragma/item-verdict.md
          required: true
          kind: verdict
          allowed_values: [APPROVE, BLOCK]
          description: Reviewer verdict for the current checklist item.

  - id: route_item_verdict
    control:
      artifact_verdict:
        path: /tmp/pragma/item-verdict.md
        approve_event: item_approve
        block_event: item_block

  - id: item_block_router
    persona: item_block_router
    task_prompt: none
    artifacts:
      outputs:
        - id: item_block_classification
          path: /tmp/pragma/item-block-classification.json
          required: true
          kind: decision
          allowed_values: [repair_patch_plan, repair_checklist_scope, redo_item_worker, unresolved_ambiguity]
          description: Machine-readable classification of the item block.

  - id: route_item_block_classification
    control:
      artifact_decision:
        path: /tmp/pragma/item-block-classification.json
        field: decision
        events:
          repair_patch_plan: repair_patch_plan
          repair_checklist_scope: repair_checklist_scope
          redo_item_worker: redo_item_worker
          unresolved_ambiguity: unresolved_ambiguity

  - id: mark_item_completed
    control:
      mark_current_item:
        list_path: /tmp/pragma/checklist.json
        cursor_path: /tmp/pragma/current-item.json
        status: completed
        event: complete
        dependency:
          dependency_ids_field: blocked_by
          dependency_reason_field: block_reason
          blocked_status: blocked
          unblocked_status: pending
          auto_unblock_dependents: true

  - id: validation_runner
    persona: validation_runner
    task_prompt: none
    artifacts:
      outputs:
        - id: validation_status
          path: /tmp/pragma/validation-status.md
          required: true
          description: Focused validation status for final review.

  - id: final_reviewer
    persona: final_reviewer
    task_prompt: none
    artifacts:
      outputs:
        - id: final_verdict
          path: /tmp/pragma/final-prosecutor-verdict.md
          required: true
          kind: verdict
          allowed_values: [APPROVE, BLOCK]
          description: Final reviewer verdict for the full task.

  - id: route_final_verdict
    control:
      artifact_verdict:
        path: /tmp/pragma/final-prosecutor-verdict.md
        approve_event: final_approve
        block_event: final_block

  - id: done
    terminal: true

transitions:
  - event: complete
    from: [surface_mapper]
    to: evidence_collector
    handoff:
      - id: surface_map
        path: /tmp/pragma/surface-map.md
        required: true
        description: Surface map from the first narrowing phase.
  - event: complete
    from: [evidence_collector]
    to: behavior_evidence_mapper
    handoff:
      - id: surface_map
        path: /tmp/pragma/surface-map.md
        required: true
        description: Surface map from the first narrowing phase.
      - id: repo_evidence
        path: /tmp/pragma/repo-evidence.md
        required: true
        description: Direct repository facts collected from mapped surfaces.
  - event: complete
    from: [behavior_evidence_mapper]
    to: patch_planner
    handoff:
      - id: surface_map
        path: /tmp/pragma/surface-map.md
        required: true
        description: Surface map from the first narrowing phase.
      - id: evidence_map
        path: /tmp/pragma/evidence-map.md
        required: true
        description: Evidence map used as the route authority.
  - event: complete
    from: [patch_planner]
    to: checklist_writer
    handoff:
      - id: checklist
        path: /tmp/pragma/checklist.json
        description: Existing checklist, when this is a later checklist_writer visit.
      - id: patch_plan
        path: /tmp/pragma/patch-plan.md
        required: true
        description: Patch route to convert into checklist items.
      - id: final_verdict
        path: /tmp/pragma/final-prosecutor-verdict.md
        description: Final reviewer blocker, when a final repair pass is active.
      - id: item_verdict
        path: /tmp/pragma/item-verdict.md
        description: Current item reviewer blocker, when no final verdict exists.
      - id: item_block_classification
        path: /tmp/pragma/item-block-classification.json
        description: Classified item-block ambiguity or repair direction, when an item block has been routed.
  - event: complete
    from: [checklist_writer]
    to: next_item
  - event: item_available
    from: [next_item]
    to: item_worker
    handoff:
      - id: current_item
        path: /tmp/pragma/current-item.json
        required: true
        description: Current checklist item selected by the item loop.
        prompt_attachments: [source_edit_transport]
      - id: current_item_handoff
        path: /tmp/pragma/handoff-prompts/next_item/current-item.md
        required: true
        description: Persona-authored handoff written by next_item for the selected item.
  - event: all_items_done
    from: [next_item]
    to: validation_runner
    handoff:
      - id: checklist
        path: /tmp/pragma/checklist.json
        required: true
        description: Completed checklist to validate.
  - event: items_blocked
    from: [next_item]
    to: done
  - event: complete
    from: [item_worker]
    to: item_reviewer
    handoff:
      - id: current_item
        path: /tmp/pragma/current-item.json
        required: true
        description: Current checklist item under review.
      - id: implementer_report
        path: /tmp/pragma/implementer-report.md
        required: true
        description: Worker report for the current item.
  - event: complete
    from: [item_reviewer]
    to: route_item_verdict
  - event: item_approve
    from: [route_item_verdict]
    to: mark_item_completed
  - event: item_block
    from: [route_item_verdict]
    to: item_block_router
    handoff:
      - id: current_item
        path: /tmp/pragma/current-item.json
        required: true
        description: Current checklist item that was blocked.
      - id: implementer_report
        path: /tmp/pragma/implementer-report.md
        required: true
        description: Worker report that led to the block.
      - id: item_verdict
        path: /tmp/pragma/item-verdict.md
        required: true
        description: Reviewer blocker to classify.
      - id: checklist
        path: /tmp/pragma/checklist.json
        description: Existing checklist containing the current item.
      - id: patch_plan
        path: /tmp/pragma/patch-plan.md
        description: Current patch route, when available.
      - id: evidence_map
        path: /tmp/pragma/evidence-map.md
        description: Evidence map, when available for source ownership classification.
  - event: complete
    from: [item_block_router]
    to: route_item_block_classification
  - event: repair_patch_plan
    from: [route_item_block_classification]
    to: patch_planner
    handoff:
      - id: checklist
        path: /tmp/pragma/checklist.json
        required: true
        description: Existing checklist to preserve while repairing the patch plan.
      - id: surface_map
        path: /tmp/pragma/surface-map.md
        required: true
        description: Surface map from the first narrowing phase.
      - id: evidence_map
        path: /tmp/pragma/evidence-map.md
        required: true
        description: Evidence map used as the route authority.
      - id: item_verdict
        path: /tmp/pragma/item-verdict.md
        required: true
        description: Current item reviewer blocker.
      - id: item_block_classification
        path: /tmp/pragma/item-block-classification.json
        required: true
        description: Classified item-block repair direction.
  - event: repair_checklist_scope
    from: [route_item_block_classification]
    to: checklist_writer
    handoff:
      - id: checklist
        path: /tmp/pragma/checklist.json
        description: Existing checklist to repair.
      - id: patch_plan
        path: /tmp/pragma/patch-plan.md
        required: true
        description: Patch route for checklist repair.
      - id: current_item
        path: /tmp/pragma/current-item.json
        required: true
        description: Current checklist item whose scope needs repair.
      - id: item_verdict
        path: /tmp/pragma/item-verdict.md
        required: true
        description: Current item reviewer blocker.
      - id: item_block_classification
        path: /tmp/pragma/item-block-classification.json
        required: true
        description: Classified checklist repair context.
  - event: redo_item_worker
    from: [route_item_block_classification]
    to: item_worker
    handoff:
      - id: current_item
        path: /tmp/pragma/current-item.json
        required: true
        description: Current checklist item selected by the item loop.
        prompt_attachments: [source_edit_transport]
      - id: current_item_handoff
        path: /tmp/pragma/handoff-prompts/next_item/current-item.md
        required: true
        description: Persona-authored handoff written by next_item for the selected item.
      - id: implementer_report
        path: /tmp/pragma/implementer-report.md
        required: true
        description: Previous worker report for the retry.
      - id: item_verdict
        path: /tmp/pragma/item-verdict.md
        required: true
        description: Reviewer blocker for the retry.
      - id: item_block_classification
        path: /tmp/pragma/item-block-classification.json
        required: true
        description: Classified retry direction for the worker.
  - event: unresolved_ambiguity
    from: [route_item_block_classification]
    to: patch_planner
    handoff:
      - id: checklist
        path: /tmp/pragma/checklist.json
        required: true
        description: Existing checklist to preserve while resolving item ambiguity.
      - id: surface_map
        path: /tmp/pragma/surface-map.md
        required: true
        description: Surface map from the first narrowing phase.
      - id: evidence_map
        path: /tmp/pragma/evidence-map.md
        required: true
        description: Evidence map used as the route authority.
      - id: item_verdict
        path: /tmp/pragma/item-verdict.md
        required: true
        description: Current item reviewer blocker.
      - id: item_block_classification
        path: /tmp/pragma/item-block-classification.json
        required: true
        description: Unresolved ambiguity classification.
  - event: complete
    from: [mark_item_completed]
    to: checklist_writer
    handoff:
      - id: checklist
        path: /tmp/pragma/checklist.json
        description: Existing checklist after marking the current item complete.
      - id: patch_plan
        path: /tmp/pragma/patch-plan.md
        required: true
        description: Current patch route for remaining checklist work.
  - event: complete
    from: [validation_runner]
    to: final_reviewer
    handoff:
      - id: validation_status
        path: /tmp/pragma/validation-status.md
        required: true
        description: Validation status from the validation runner.
  - event: complete
    from: [final_reviewer]
    to: route_final_verdict
  - event: final_approve
    from: [route_final_verdict]
    to: done
  - event: final_block
    from: [route_final_verdict]
    to: patch_planner
    handoff:
      - id: checklist
        path: /tmp/pragma/checklist.json
        required: true
        description: Existing completed checklist to preserve during final repair.
      - id: surface_map
        path: /tmp/pragma/surface-map.md
        required: true
        description: Surface map from the first narrowing phase.
      - id: evidence_map
        path: /tmp/pragma/evidence-map.md
        required: true
        description: Evidence map used as the route authority.
      - id: final_verdict
        path: /tmp/pragma/final-prosecutor-verdict.md
        required: true
        description: Final reviewer blocker for the repair pass.
